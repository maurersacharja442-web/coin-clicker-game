<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Clicker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e293b);
            color: white;
            text-align: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 40px;
            font-size: 42px;
        }

        #coins {
            font-size: 32px;
            margin: 20px;
            font-weight: bold;
        }

        #coin {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 8px solid #f59e0b;
            background: radial-gradient(circle, #fde047, #eab308);
            font-size: 80px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.5);
            transition: transform 0.1s;
        }

        #coin:active {
            transform: scale(0.9);
        }

        .shop {
            margin: 40px auto;
            max-width: 400px;
            background: rgba(255,255,255,0.08);
            padding: 25px;
            border-radius: 20px;
        }

        button.upgrade {
            width: 100%;
            margin: 10px 0;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #22c55e;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button.upgrade:hover {
            background: #16a34a;
        }

        #message {
            min-height: 25px;
            color: #facc15;
        }
    </style>
</head>

<body>

    <h1>🪙 Coin Clicker</h1>

    <div id="coins">Coins: 0</div>

    <button id="coin">🪙</button>

    <p>Coins pro Klick: <span id="perClick">1</span></p>

    <div class="shop">
        <h2>🛒 Shop</h2>

        <button class="upgrade" onclick="buyUpgrade()">
            ⚡ Klick-Power +1
            <br>
            Kosten: <span id="upgradeCost">50</span> Coins
        </button>

        <button class="upgrade" onclick="buyAutoClicker()">
            🤖 Auto Clicker +1 Coin/Sekunde
            <br>
            Kosten: <span id="autoCost">100</span> Coins
        </button>

        <p>Auto Clicker: <span id="auto">0</span>/Sekunde</p>
        <p id="message"></p>
    </div>

    <script>
        let coins = 0;
        let perClick = 1;

        let upgradeCost = 50;

        let autoClickers = 0;
        let autoCost = 100;

        const coinsText = document.getElementById("coins");
        const perClickText = document.getElementById("perClick");
        const upgradeCostText = document.getElementById("upgradeCost");
        const autoCostText = document.getElementById("autoCost");
        const autoText = document.getElementById("auto");
        const message = document.getElementById("message");

        document.getElementById("coin").addEventListener("click", () => {
            coins += perClick;
            update();
        });

        function buyUpgrade() {
            if (coins >= upgradeCost) {
                coins -= upgradeCost;
                perClick++;

                upgradeCost = Math.floor(upgradeCost * 1.5);

                message.textContent = "⚡ Klick-Power verbessert!";
                update();
            } else {
                message.textContent = "❌ Du hast nicht genug Coins!";
            }
        }

        function buyAutoClicker() {
            if (coins >= autoCost) {
                coins -= autoCost;
                autoClickers++;

                autoCost = Math.floor(autoCost * 1.7);

                message.textContent = "🤖 Auto Clicker gekauft!";
                update();
            } else {
                message.textContent = "❌ Du hast nicht genug Coins!";
            }
        }

        setInterval(() => {
            coins += autoClickers;
            update();
        }, 1000);

        function update() {
            coinsText.textContent = "Coins: " + Math.floor(coins);
            perClickText.textContent = perClick;
            upgradeCostText.textContent = upgradeCost;
            autoCostText.textContent = autoCost;
            autoText.textContent = autoClickers;
        }
    </script>

</body>
</html>
